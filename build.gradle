plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ktb.howard'
version = '0.0.1-SNAPSHOT'
description = 'KTB Community Server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    /* QueryDSL - 취약점이 패치된 커뮤니티 유지보수 버전으로 변경 */
    var queryDslVersion = "5.1.1" // 패치된 최신 버전
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${queryDslVersion}:jakarta"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${queryDslVersion}:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    /* Swagger */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
    /* Spring Security Crypto */
    implementation 'org.springframework.security:spring-security-crypto'
    /* AWS S3 */
    implementation platform('software.amazon.awssdk:bom:2.26.25')
    implementation 'software.amazon.awssdk:s3'
    /* Guava */
    implementation 'com.google.guava:guava:33.5.0-jre'
    /* Redis */
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    /* Actuator: /actuator 엔드포인트를 활성화 */
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    /* Micrometer: Actuator가 '프로메테우스' 형식으로 메트릭을 가공 */
    implementation 'io.micrometer:micrometer-registry-prometheus'
    /* AWS Lambda */
    implementation 'software.amazon.awssdk:lambda:2.20.150'
    /* 테스트용 인메모리 DB (MySQL 대신 사용) */
    testImplementation 'com.h2database:h2'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
    // testRuntimeClasspath에서 mockito-core JAR을 찾아 -javaagent로 전달
    doFirst {
        def mockitoJar = configurations.testRuntimeClasspath
                .filter { it.name.startsWith('mockito-core-') }
                .singleFile
        jvmArgs "-javaagent:${mockitoJar.absolutePath}"
    }
}

tasks.bootJar {
    archiveFileName.set("leum-server.jar")
}

/* QueryDSL 생성 파일 경로 설정 */
def generatedDir = layout.buildDirectory.dir('generated/querydsl')

sourceSets {
    main.java.srcDirs += [ generatedDir ]
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(generatedDir)
}

clean.doLast {
    project.delete(generatedDir)
}